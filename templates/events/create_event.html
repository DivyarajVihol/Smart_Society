{% extends 'base.html' %}
{% block title %}Schedule Event - Smart Society{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-8 col-lg-7">
        <div class="card p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="nav-icon-bubble bubble-events mb-0" style="width: 46px; height: 46px; font-size: 1.2rem;">
                    <i class="fa-solid fa-calendar-plus"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0">Schedule Community Event</h3>
                    <p class="text-muted small mb-0">Plan gatherings and celebrations for society residents</p>
                </div>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Event Title</label>
                    <input type="text" name="title" class="form-control" required placeholder="e.g. Diwali Celebration / AGM Meeting">
                </div>
                
                <div class="row mb-3 g-3">
                    <div class="col-md-6">
                        <label class="form-label">Event Date</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Start Time</label>
                        <input type="time" name="time" class="form-control" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Venue / Location</label>
                    <input type="text" name="location" class="form-control" placeholder="e.g. Society Clubhouse / Central Garden" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Event Description & Agenda</label>
                    <textarea name="description" rows="4" class="form-control" required placeholder="Outline event schedule, details, or participation notes..."></textarea>
                </div>
                
                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'events:events_list' %}" class="btn btn-outline-light">
                        <i class="fa-solid fa-arrow-left me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-calendar-check me-1"></i> Publish Event
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
