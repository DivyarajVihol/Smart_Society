{% extends 'base.html' %}
{% block title %}Create Poll - Smart Society{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3 animate-fade-in">
    <div class="col-md-7 col-lg-6">
        <div class="card p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="nav-icon-bubble bubble-notices mb-0" style="width: 48px; height: 48px; font-size: 1.25rem;">
                    <i class="fa-solid fa-square-poll-vertical"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0 text-white">Create Community Poll</h3>
                    <p class="text-muted small mb-0">Gather resident feedback on society upgrades & decisions</p>
                </div>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label">Poll Question</label>
                    <input type="text" name="question" class="form-control" required placeholder="E.g., Should we install EV charging stations in Basement 1?">
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Voting Options</label>
                    <div class="d-grid gap-2" id="optionsContainer">
                        <input type="text" name="options" class="form-control" placeholder="Option 1" required>
                        <input type="text" name="options" class="form-control" placeholder="Option 2" required>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="addOption()">
                        <i class="fa-solid fa-plus me-1"></i> Add Another Option
                    </button>
                </div>
                
                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'events:polls_list' %}" class="btn btn-outline-secondary">
                        <i class="fa-solid fa-arrow-left me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-paper-plane me-1"></i> Publish Poll
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let optionCount = 2;
    function addOption() {
        optionCount++;
        const container = document.getElementById('optionsContainer');
        const input = document.createElement('input');
        input.type = 'text';
        input.name = 'options';
        input.className = 'form-control';
        input.placeholder = `Option ${optionCount}`;
        input.required = true;
        container.appendChild(input);
    }
</script>
{% endblock %}
