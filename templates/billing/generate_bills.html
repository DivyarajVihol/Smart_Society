{% extends 'base.html' %}
{% block title %}Generate Bills - Smart Society{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-7 col-lg-6">
        <div class="card p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="nav-icon-bubble bubble-bills mb-0" style="width: 46px; height: 46px; font-size: 1.2rem;">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0">Generate Monthly Invoices</h3>
                    <p class="text-muted small mb-0">Create maintenance invoices across all society flats</p>
                </div>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="row mb-3 g-3">
                    <div class="col-md-6">
                        <label class="form-label">Billing Month</label>
                        <select name="month" class="form-select" required>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December" selected>December</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Billing Year</label>
                        <input type="number" name="year" class="form-control" value="2026" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Flat Maintenance Amount (₹)</label>
                    <input type="number" step="0.01" name="amount" class="form-control" placeholder="e.g. 5000.00" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Due Date for Payment</label>
                    <input type="date" name="due_date" class="form-control" required>
                </div>
                
                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-light">
                        <i class="fa-solid fa-arrow-left me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-paper-plane me-1"></i> Generate for All Flats
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
