{% extends 'base.html' %}
{% block title %}Create Gate Pass - Smart Society{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1 fw-bold text-dark">
            <i class="fa-solid fa-id-badge text-warning me-2"></i>Create Visitor Gate Pass
        </h2>
        <p class="text-muted mb-0 small">Authorize temporary guests or recurring staff entries</p>
    </div>
    <a href="{% url 'visitors:my_gate_passes' %}" class="btn btn-outline-secondary btn-sm">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Passes
    </a>
</div>

<div class="row g-4 mb-4">
    <!-- Type selector cards -->
    <div class="col-md-6">
        <label class="d-block text-decoration-none" id="label-temp">
            <input type="radio" name="pass_type_select" value="TEMPORARY" id="radio-temp" class="d-none" checked>
            <div class="nav-card-modern p-4 text-center" id="card-temp"
                 style="border-color: var(--color-primary) !important; background: var(--color-tint-blue) !important;">
                <div class="nav-icon-bubble bubble-passes mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.25rem;">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <h5 class="text-dark fw-bold mb-1">Temporary Pass</h5>
                <p class="text-muted small mb-0">Valid on a single specified day for one-time guests, deliveries, or contractors.</p>
            </div>
        </label>
    </div>
    <div class="col-md-6">
        <label class="d-block text-decoration-none" id="label-perm">
            <input type="radio" name="pass_type_select" value="PERMANENT" id="radio-perm" class="d-none">
            <div class="nav-card-modern p-4 text-center" id="card-perm">
                <div class="nav-icon-bubble bubble-events mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.25rem;">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h5 class="text-dark fw-bold mb-1">Permanent Pass</h5>
                <p class="text-muted small mb-0">Always valid recurring pass for family members, domestic help, or daily drivers.</p>
            </div>
        </label>
    </div>
</div>

<!-- Form -->
<div class="card p-4 p-md-5">
    <form method="post" action="{% url 'visitors:create_gate_pass' %}">
        {% csrf_token %}
        <input type="hidden" name="pass_type" id="pass_type_hidden" value="TEMPORARY">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Visitor Full Name <span class="text-danger">*</span></label>
                <input type="text" name="visitor_name" class="form-control" placeholder="e.g. Ravi Shah" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Contact Phone Number</label>
                <input type="tel" name="phone" class="form-control" placeholder="e.g. +91 98765 43210">
            </div>
            <div class="col-md-6">
                <label class="form-label">Purpose / Relationship</label>
                <input type="text" name="purpose" class="form-control" placeholder="e.g. Guest, House Help, Courier">
            </div>
            <div class="col-md-6" id="date-field">
                <label class="form-label">Valid Entry Date <span class="text-danger">*</span></label>
                <input type="date" name="expected_date" class="form-control" value="{{ today }}" min="{{ today }}">
            </div>
        </div>

        <div class="mt-4 d-flex justify-content-between align-items-center">
            <a href="{% url 'visitors:my_gate_passes' %}" class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i> Cancel
            </a>
            <button type="submit" class="btn btn-warning">
                <i class="fa-solid fa-ticket me-1"></i> Issue Gate Pass
            </button>
        </div>
    </form>
</div>

{% endblock %}

{% block extra_js %}
<script>
    const radios    = document.querySelectorAll('input[name="pass_type_select"]');
    const cardTemp  = document.getElementById('card-temp');
    const cardPerm  = document.getElementById('card-perm');
    const hiddenInput = document.getElementById('pass_type_hidden');
    const dateField = document.getElementById('date-field');

    radios.forEach(radio => {
        radio.addEventListener('change', () => {
            const isPerm = document.getElementById('radio-perm').checked;
            hiddenInput.value = isPerm ? 'PERMANENT' : 'TEMPORARY';

            if (isPerm) {
                cardTemp.style.borderColor = 'var(--border-card)';
                cardTemp.style.background = '#FFFFFF';
                cardPerm.style.borderColor = 'var(--color-primary)';
                cardPerm.style.background = 'var(--color-tint-blue)';
            } else {
                cardTemp.style.borderColor = 'var(--color-primary)';
                cardTemp.style.background = 'var(--color-tint-blue)';
                cardPerm.style.borderColor = 'var(--border-card)';
                cardPerm.style.background = '#FFFFFF';
            }
            dateField.style.display = isPerm ? 'none' : 'block';
        });
    });
</script>
{% endblock %}
