{% extends 'base.html' %}
{% block title %}File Complaint - Smart Society{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-8 col-lg-7">
        <div class="card p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="nav-icon-bubble bubble-complaints mb-0" style="width: 46px; height: 46px; font-size: 1.2rem;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0">File a Service Complaint</h3>
                    <p class="text-muted small mb-0">Notify the society committee of maintenance issues</p>
                </div>
            </div>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Complaint Title</label>
                    <input type="text" name="title" class="form-control" placeholder="E.g., Water leakage in corridor / Lift not functioning" required>
                </div>
                
                <div class="row mb-3 g-3">
                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            {% for key, name in categories %}
                                <option value="{{ key }}">{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Attach Photo (Optional)</label>
                        <input type="file" name="photo" class="form-control" accept="image/*">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Detailed Description</label>
                    <textarea name="description" rows="4" class="form-control" required placeholder="Describe the location, severity, and details of the problem..."></textarea>
                </div>
                
                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'complaints:list' %}" class="btn btn-outline-light">
                        <i class="fa-solid fa-arrow-left me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-danger">
                        <i class="fa-solid fa-paper-plane me-1"></i> Submit Complaint
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
