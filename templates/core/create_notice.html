{% extends 'base.html' %}
{% block title %}Post Notice - Smart Society{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-8 col-lg-7">
        <div class="card p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="nav-icon-bubble bubble-notices mb-0" style="width: 46px; height: 46px; font-size: 1.2rem;">
                    <i class="fa-solid fa-bullhorn"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0 text-dark">Broadcast Notice</h3>
                    <p class="text-muted small mb-0">Publish an announcement to all society residents</p>
                </div>
            </div>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Notice Title</label>
                    <input type="text" name="title" class="form-control" placeholder="E.g. Annual General Meeting / Water Tank Cleaning" required>
                </div>
                
                <div class="row mb-3 g-3">
                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            {% for key, name in categories %}
                                <option value="{{ key }}">{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Attachment (PDF or Image)</label>
                        <input type="file" name="attachment" class="form-control">
                    </div>
                </div>
                
                <div class="row mb-3 g-3">
                    <div class="col-md-6">
                        <label class="form-label">Start Date</label>
                        <input type="date" name="start_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Expiry Date</label>
                        <input type="date" name="expiry_date" class="form-control" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Notice Details & Content</label>
                    <textarea name="description" rows="5" class="form-control" required placeholder="Write the full announcement details here..."></textarea>
                </div>
                
                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'core:notices' %}" class="btn btn-outline-secondary">
                        <i class="fa-solid fa-arrow-left me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-paper-plane me-1"></i> Post Notice
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
