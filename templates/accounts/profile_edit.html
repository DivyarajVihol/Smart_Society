{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Profile - Smart Society{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-7 col-lg-6">
        <div class="card p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="brand-icon-badge" style="width: 44px; height: 44px; font-size: 1.2rem;">
                    <i class="fa-solid fa-user-pen"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0">Edit Profile</h3>
                    <p class="text-muted small mb-0">Update your personal contact details</p>
                </div>
            </div>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                
                <div class="mt-4 d-flex justify-content-between align-items-center">
                    <a href="{% url 'profile' %}" class="btn btn-outline-light">
                        <i class="fa-solid fa-arrow-left me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
